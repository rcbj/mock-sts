# Runs this repository's whole test suite, in containers — TWICE, in two jobs
# that do not depend on each other: the plain suite, and the same suite with
# coverage collected.
#
# Both wrap a launcher that needs docker and NOTHING ELSE: no node, no npm
# install, no Chrome, no checkout of the parent project. That is the property
# this workflow exists to use, and it is why the suite was made self-contained
# on 2026-08-28 and why ./run-coverage.sh was containerized on 2026-08-29.
#
#   tests     ./docker-run-tests.sh — builds docker-compose-run-tests.yml (the
#             service from this repository's Dockerfile, and a test runner with
#             node and a Chrome in it), runs all twenty-three jobs against the
#             service over the compose network, and always tears the stack down.
#   coverage  ./run-coverage.sh — HALF of that same compose file. It puts the
#             RUNNER in the `tests` image and lets it start the service it
#             measures as a child process in there, because V8 writes coverage
#             from inside the process being measured and a service container
#             next door can never be under the report.
#
# WHY THEY ARE TWO JOBS RATHER THAN TWO STEPS, which is the shape
# ../id-proto-debugger/.github/workflows/tests.yml uses and the reason to copy
# it here. Both launchers write tests/report/ and point tests/report/latest at
# their own timestamped directory. In one job the second run moves that symlink
# before either upload reads it, so an artifact named for the plain suite would
# hold the coverage run's report — wrong, and wrong silently. Two jobs are two
# workspaces, so each `latest` is its own. Two more things fall out of it: the
# coverage pass still runs when the plain suite goes red, which is when its
# report is most worth having, and the two run in PARALLEL, so the wall clock
# is the slower of them rather than the sum. What it costs is a second image
# build, since nothing is shared between jobs — that is the trade, and it is
# the one the parent project made.
#
# WHAT THIS COVERS THAT build-container.yml DOES NOT. That workflow builds the
# image and waits for /healthcheck, which proves every module resolved and the
# port bound — the failure mode this repository has actually had most often.
# This one drives the running service: the ten in-process jobs that assert
# module contracts, and the thirteen protocol jobs that exercise OAuth 2.0,
# OIDC, DPoP, SAML 1.1 and 2.0, the credential issuer, the DID chain, the
# management API and — in a real browser — the admin console. The two overlap
# only in that both start the image.
#
# WHY IT IS NOT THE PARENT PROJECT'S SUITE. Most of what covers this service is
# authored in ../id-proto-debugger/tests/ (the root CLAUDE.md argues that
# decision), and their CI drives the `sts/` gitlink — which is a PIN. A change
# made here is not covered by that run until somebody bumps it. Thirteen of
# those jobs are vendored into tests/vendored/ precisely so that this repository
# can run them against its own working tree; this workflow is where that
# happens on every push. It does not replace bumping the pin, because that is
# what gates the other project.
name: Tests

on:
  # Every push to main — which is what a merged pull request is — and every PR
  # aimed at it. A protocol job here takes about a minute and the image builds
  # are most of the wall clock; that is affordable per push and is the only way
  # a suite gets trusted.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # THE PLAIN SUITE. All twenty-three jobs, service and runner both in
  # containers, nothing instrumented. This is the one whose status means "the
  # tree is green".
  # ---------------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    # The suite itself is about a minute and the two images are several more; a
    # hung browser job is caught by run-report.js's own per-job watchdog. This
    # is the outer bound for a runner that has wedged — without it a stuck job
    # holds a runner for six hours.
    timeout-minutes: 45
    steps:
      # submodules: recursive is LOAD-BEARING, and `true` is not enough. The
      # embedded directory's library is `"ldapjs": "file:node-ldapjs"` — a git
      # SUBMODULE — and this repository is itself a submodule of the parent
      # project, so there are submodules inside submodules and `true` stops one
      # level short. An uninitialised submodule is an EMPTY DIRECTORY, so
      # nothing fails loudly: the COPY succeeds, npm installs a package with no
      # `main`, both images build, and the container dies at startup with
      # `Cannot find module 'ldapjs'` — a message naming a package rather than a
      # checkout. Both Dockerfiles and the launcher's preflight guard it too;
      # asking for it here keeps a fetch failure on the checkout step, where it
      # reads as one.
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ubuntu-latest runners ship docker and the compose plugin, so nothing is
      # installed here. This is where the parent project's workflow installs
      # docker-compose, and the difference is that its launcher supports the v1
      # standalone binary as well; tests/tools/compose.sh finds either.
      - name: Show docker and compose versions
        run: |
          docker --version
          docker compose version

      # The whole suite. The script resolves compose itself (and never prompts
      # for a sudo password), builds both images from this checkout, and exits
      # with the test container's status.
      - name: Run the containerized test suite
        run: ./docker-run-tests.sh

      # The tests container writes tests/report as root through a bind mount;
      # hand it back to the runner user before the upload step reads it.
      # `|| true` because a run that failed before writing anything must not
      # fail HERE and hide why.
      - name: Normalize report permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" tests/report || true

      # if: always() — the report is at its most useful when the run went red.
      # `latest` is a symlink into the timestamped directory beside it, and
      # upload-artifact follows it.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/report/latest
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # THE SAME SUITE AGAIN, INSTRUMENTED. What this adds is the only question the
  # job above cannot answer: WHICH LINES of this tree the twenty-three jobs
  # actually reached. It is the second half of the picture for anybody deciding
  # what to test next, and it is worth a CI run because the report is the thing
  # nobody generates by hand.
  #
  # It builds its own images — this job shares no workspace and no docker cache
  # with the one above, so --no-build would have nothing to reuse. Its compose
  # project is mock-sts-coverage, which is what keeps the two runs from reaching
  # each other's containers even when they land on one machine.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-latest
    # The instrumented pass is a suite plus a render on top of the image build,
    # so it gets more room than the plain one.
    timeout-minutes: 60
    steps:
      # See the tests job: recursive, for the nested node-ldapjs submodule.
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show docker and compose versions
        run: |
          docker --version
          docker compose version

      # `docker compose run --rm --no-deps` on the tests service alone: the
      # runner is in the container and the service it measures is a child
      # process beside it, so everything V8 writes is written by processes this
      # run started. ./coverage and ./tests/report are bind mounts, so both come
      # out onto the host.
      - name: Run the suite with coverage, in containers
        run: ./run-coverage.sh

      # Belt and braces: run-coverage.sh already hands both directories back
      # with a throwaway root container of its own (it has to — the NEXT HOST
      # run of that script dies clearing coverage/raw otherwise), but that step
      # is best-effort and says so. If it worked this chown is a no-op; if it
      # did not, the uploads below can still read what they were given.
      # `|| true` for the tests job's reason.
      - name: Normalize coverage permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" coverage tests/report || true

      # The rendered coverage — index.html with a page per file, lcov.info for
      # anything that reads that, summary.json for the totals, and raw/ so that
      # somebody who would rather point c8 at the same data can. `warn` rather
      # than `error` because a run that went red before the render is a run with
      # no coverage to upload, and that must not be a second failure.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 30

      # The instrumented run's OWN test report, under a name of its own —
      # artifact names must be unique across a workflow run, and this is a
      # different run of the suite from the one the tests job uploaded. Worth
      # keeping both: a job that passes plain and fails under coverage is a real
      # thing (the throwaway service is a child process here, not a container),
      # and without this there would be no report to read it from.
      - name: Upload the coverage run's test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-report
          path: tests/report/latest
          if-no-files-found: warn
          retention-days: 30
