# Builds docs/ as a Jekyll site and deploys it to GitHub Pages.
#
# WHY THIS SHAPE. The parent project (rcbj/oauth2-oidc-debugger) has no Pages
# workflow to copy: its site is static content pushed to S3 + CloudFront from a
# container, which needs AWS credentials this repository does not have and does
# not want. The only gh-pages job anywhere in that tree is inside the node-ldapjs
# submodule, and it pushes a built directory into a DIFFERENT repository with a
# personal access token — the pre-Pages-v2 pattern, and not one to copy in 2026:
# it needs a secret, and the secret grants write access to another repo.
#
# So this is GitHub's own arrangement instead. configure-pages, then
# jekyll-build-pages, then deploy-pages. It needs no secret at all — the
# id-token/pages permissions below are what authorise the deployment — and no
# dependency in package.json, which matters here: this repository's dependencies
# are deliberately short, its image is built in containers that may have no
# network beyond the registry, and a documentation toolchain has no business
# being installed by `npm install` for a service that does not render markdown at
# runtime.
#
# MkDocs was the alternative and was weighed rather than skipped. It has better
# navigation and search out of the box, and it would add a Python toolchain to a
# repository that currently has only Node, plus a theme version that is a moving
# part. `minima` is the theme GitHub Pages ships; the markdown stays readable in
# the repository, which is where a maintainer actually reads it.
#
# BEFORE THE FIRST RUN, Pages has to EXIST for this repository and be set to
# build from GitHub Actions. The paragraph that used to be here said somebody had
# to do that by hand in Settings → Pages, and nobody did: every run from the
# first one on 2026-08-23 to 2026-08-24 failed, all four of them in the same
# place. It is also not the deploy step that fails, which is what that paragraph
# predicted — configure-pages asks the API for the site before anything is built
# and gets `Not Found`, so the failure arrives second, the site is never built,
# and the error names the REST endpoint rather than the setting:
#
#     Get Pages site failed. Please verify that the repository has Pages
#     enabled and configured to build using GitHub Actions
#     HttpError: Not Found - .../rest/pages/pages#get-a-apiname-pages-site
#
# `enablement: true` BELOW WAS PUT HERE AS THE FIX AND IT IS NOT ONE, WHICH
# TOOK ANOTHER FOUR FAILED RUNS AND FOUR DAYS TO ESTABLISH. The paragraph that
# used to be here said the action would create the Pages site on the first run
# and be a no-op afterwards, so that no out-of-band step was needed. What it
# actually does with this repository's GITHUB_TOKEN is ask, fail, try to
# create, and fail differently:
#
#     Get Pages site failed. Error: Not Found
#     Create Pages site failed. Error: Resource not accessible by integration
#     HttpError: Resource not accessible by integration
#
# The second line is the one that matters and it is not about `enablement`:
# creating a Pages site is an ADMINISTRATIVE write, and the token a workflow
# runs with cannot make it however its permissions are set — `pages: write`
# authorises deploying to a site that exists, not bringing one into being.
#
# SO THE SITE WAS CREATED ONCE, OUT OF BAND, on 2026-08-29, with a credential
# that has admin on the repository:
#
#     gh api -X POST repos/rcbj/mock-sts/pages -f build_type=workflow
#
# (Settings → Pages → Source: GitHub Actions is the same thing through the web
# interface.) The next run went green and https://rcbj.github.io/mock-sts/ is
# the site. `enablement: true` is KEPT rather than removed because it costs one
# warning line and is what makes a FORK — where the person running it may well
# have the rights this token does not — work with no step at all; it is simply
# not what fixed this repository, and this paragraph exists so that the next
# `Not Found` here is read as "the site does not exist" rather than as
# something about the workflow.
name: Deploy docs to GitHub Pages

on:
  # Only when the documentation or this workflow changes. The container build
  # (build-container.yml) runs on every push to main and this does not need to:
  # a source change cannot alter the site, because nothing here is generated
  # from the source. If that ever stops being true — a page built from
  # sts_metadata.js, say — this filter is the first thing to remove.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# The three permissions the official flow needs, and no more. `contents: read`
# rather than write: nothing here pushes a branch, which is the whole difference
# from the gh-pages pattern this replaced.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one is NOT cancelled: a half-finished
# Pages deployment is a site serving a mixture of two builds. cancel-in-progress
# is right for a test suite and wrong for this.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules. node-ldapjs is 30 MB of a library this site does not
      # mention, and the build-container job is where its absence would matter.
      # Fetching it here would only make this job slower and its failures
      # confusing.
      - name: Check out
        uses: actions/checkout@v4

      # `enablement: true` — create the Pages site if this repository has none,
      # rather than failing with a 404 that names the REST endpoint. See the
      # header comment: the by-hand alternative was the arrangement here for four
      # runs and all four failed.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `source: ./docs` — the site is that directory and nothing above it, so
      # README.md, the CLAUDE.md files and the source tree are not published. The
      # baseurl comes from configure-pages above rather than from docs/_config.yml,
      # which is why that file's own `baseurl` is a fallback for a local
      # `jekyll serve` and not the authority.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # A guard rather than trust in the step above. jekyll-build-pages succeeds
      # on an empty source directory, and the symptom of that is a deployed site
      # that is simply blank — which reads as a Pages problem rather than a build
      # one. index.html is what docs/index.md must have become.
      - name: Check the site is not empty
        run: |
          if [ ! -f _site/index.html ]; then
            echo "_site/index.html is missing — docs/index.md did not render." >&2
            ls -la _site || true
            exit 1
          fi
          echo "Built $(find _site -name '*.html' | wc -l) page(s)."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
